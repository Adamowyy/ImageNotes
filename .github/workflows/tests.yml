name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Model, canvas, autosave and window
        run: python tests/selftest.py --no-big
      - name: Performance on a 12000x8000 image
        run: python tests/selftest.py
